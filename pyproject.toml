[project]
name = "pushwm"
version = "0.1.0"
description = "Phone-video world model drives a Panda arm to push a cylinder around obstacles in MuJoCo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "torch>=2.3",
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pushwm"]
